<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Library — SAIKO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* ============================================================
   1. COLORS & FONTS — change anything here to reskin the site
   ============================================================ */
:root{
  --bg:        #fff7ec;   /* page background */
  --bg-alt:    #ffedd4;   /* alternate band */
  --ink:       #26201a;   /* text + borders + shadows */
  --muted:     #7a6f62;   /* secondary text */
  --paper:     #ffffff;   /* card surface */
  --paper-2:   #ffffff;   /* higher elevation (same in light mode) */
  --orange:    #ff6f00;
  --teal:      #17b7a6;
  --yellow:    #ffd23f;
  --blue:      #2f8fff;
  --pink:      #ff5da2;
  --grid:      rgba(38,32,26,.04);
  --shadowc:   var(--ink);   /* colour of the chunky offset shadow */
  --edge:      var(--ink);   /* border colour (softened in dark mode) */
  --maxw:      1240px;
  --gutter:    var(--s4);   /* stepped up at breakpoints below */
  --font:      "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* ---- 8pt spacing scale — use these everywhere ---- */
  --s1:  4px;    /* hairline gaps, icon padding */
  --s2:  8px;    /* tight   */
  --s3: 12px;    /* snug    */
  --s4: 16px;    /* base    */
  --s5: 24px;    /* comfy   */
  --s6: 32px;    /* roomy   */
  --s7: 48px;    /* section inner */
  --s8: 64px;    /* section  */
  --s9: 96px;    /* section large */
  --s10:128px;   /* hero    */
  --shadow:    5px 5px 0 var(--shadowc);
  --shadow-lg: 8px 8px 0 var(--shadowc);
}
:root[data-theme="dark"]{
  --bg:        #0e0e0e;   /* near-black, easy on the eyes */
  --bg-alt:    #161616;   /* alternate band, subtly lifted */
  --ink:       #f0efec;   /* warm-neutral off-white: text */
  --muted:     #9a9893;   /* neutral grey secondary text */
  --paper:     #1e1e1e;   /* card surface, lifted off the bg */
  --paper-2:   #262626;   /* higher elevation (featured card) */
  --grid:      rgba(240,239,236,.04);
  --shadowc:   #000000;   /* shadows go darker than the card */
  --edge:      #3a3a3a;   /* soft grey border, not stark white */
}

/* ============================================================
   2. BASE
   ============================================================ */
/* gutter + section rhythm steps — always on the 8pt scale */
:root{--sec:var(--s8)}
@media(min-width:600px){:root{--gutter:var(--s5)}}
@media(min-width:900px){:root{--gutter:var(--s7);--sec:var(--s9)}}
@media(min-width:1200px){:root{--gutter:var(--s8)}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important}}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
.band{padding-block:var(--sec)}
.band-alt{background:var(--bg-alt);border-block:2px solid var(--edge)}
h1,h2,h3,h4{letter-spacing:-.03em;line-height:1.05;font-weight:700}

/* ============================================================
   3. NAV
   ============================================================ */
nav{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--paper);border-bottom:2px solid var(--edge)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:var(--s4)}

/* ---- brand: stacked pixel mark + wordmark ---- */
.brand{display:flex;align-items:center;flex-shrink:0}.logo-wordmark{height:22px;width:auto;display:block;transition:opacity .15s}.brand:hover .logo-wordmark{opacity:.7}










/* ---- links with sweeping underline ---- */
.navlinks{display:flex;gap:var(--s5);align-items:center}
.navlinks a:not(.cta){font-size:.94rem;font-weight:600;color:var(--ink);position:relative;padding:var(--s1) 0}
.navlinks a:not(.cta)::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--orange);
  transform:scaleX(0);transform-origin:right;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.navlinks a:not(.cta):hover::after{transform:scaleX(1);transform-origin:left}

/* ---- right cluster ---- */
.nav-actions{display:flex;align-items:center;gap:var(--s3)}
.navlinks .cta{font-weight:700;font-size:.9rem;background:var(--orange);color:#1a1208;height:44px;padding:0 var(--s5);
  display:inline-flex;align-items:center;gap:var(--s2);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadowc);
  transition:transform .1s,box-shadow .1s}
.navlinks .cta .dot{width:8px;height:8px;border-radius:50%;background:#1a1208;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.navlinks .cta:hover{color:#1a1208;transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadowc)}
.navlinks .cta:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadowc)}

/* ---- theme switch: sliding pill, same height as the CTA ---- */
/* ---- theme switch: single square, same height as the CTA ---- */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;
  cursor:pointer;padding:0;background:var(--yellow);color:#1a1208;border:2px solid var(--edge);
  box-shadow:3px 3px 0 var(--shadowc);font-size:1.1rem;line-height:1;transition:transform .1s,box-shadow .1s}
.theme-toggle:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadowc)}
.theme-toggle:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadowc)}
.theme-toggle .ic-moon{display:none}
.theme-toggle svg{display:block}
:root[data-theme="dark"] .theme-toggle{background:var(--orange);color:#1a1208}
:root[data-theme="dark"] .theme-toggle .ic-sun{display:none}
:root[data-theme="dark"] .theme-toggle .ic-moon{display:block}

.burger{display:none;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--ink);padding:var(--s2)}
@media(max-width:880px){
  .navlinks{position:absolute;top:72px;left:0;right:0;flex-direction:column;align-items:stretch;
    background:var(--paper);border-bottom:2px solid var(--edge);padding:var(--s5) var(--gutter);gap:var(--s4);display:none}
  .navlinks.open{display:flex}
  .navlinks a:not(.cta){padding:var(--s2) 0;font-size:1.05rem}
  .nav-actions{justify-content:space-between;margin-top:var(--s2)}
  .navlinks .cta{flex:1;justify-content:center}
  .burger{display:block}
}

/* ============================================================
   4. BUTTONS
   ============================================================ */
.btn{display:inline-flex;align-items:center;gap:var(--s2);font-weight:700;font-size:.98rem;padding:var(--s3) var(--s5);border:2px solid var(--edge);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .1s;background:var(--paper);color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-lg)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadowc)}
.btn-orange{background:var(--orange);color:#1a1208}
.btn-yellow{background:var(--yellow);color:#26201a}
.btn-blue{background:var(--blue);color:#04162e}
/* buttons on the orange book panel: dark solid primary + cream solid secondaries */
.btn-onorange-primary{background:#1a1208;color:#fff;border-color:#1a1208}
.btn-onorange-primary:hover{background:#000;color:#fff}
.btn-onorange{background:#fff4e6;color:#1a1208;border-color:#1a1208}
.btn-onorange:hover{background:#fff;color:#1a1208}
:root[data-theme="dark"] .btn-yellow{color:#26201a}

/* ============================================================
   5. HERO  (with the slanted polaroid moved up here)
   ============================================================ */
.hero{padding-top:calc(72px + var(--s9));padding-bottom:var(--sec)}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s7);align-items:center}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr;gap:var(--s7)}}
.hero .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:var(--s5)}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.6rem);font-weight:800;letter-spacing:-.04em}
.hero h1 .hl{background:var(--yellow);color:#26201a;padding:0 var(--s2);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadowc);display:inline-block;transform:rotate(-2deg)}
.hero .lead{font-size:1.12rem;color:var(--muted);max-width:44ch;margin-top:var(--s5);font-weight:400}
.hero .btns{display:flex;gap:var(--s3);margin-top:var(--s6);flex-wrap:wrap}
.hero .tags{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}
.hero .tags{display:flex;gap:var(--s2) var(--s4);flex-wrap:wrap;margin-top:var(--s5);align-items:center}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  display:inline-flex;align-items:center;gap:var(--s4)}
.tag::before{content:"◆";color:var(--orange);font-size:.6rem}
/* the slanted polaroid, now in the hero */
.hero-media{display:flex;justify-content:center;align-items:center;position:relative}
.polaroid{border:2px solid var(--edge);background:var(--paper);box-shadow:var(--shadow-lg);padding:var(--s3) var(--s3) var(--s7);transform:rotate(-3deg);position:relative;max-width:440px;width:100%;transition:transform .2s}
.polaroid:hover{transform:rotate(-1deg)}
.polaroid .frame{aspect-ratio:4/3;background:var(--bg-alt);border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:var(--s4);overflow:hidden}
.polaroid .frame img{width:100%;height:100%;object-fit:cover}
.polaroid .tapecap{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--ink)}
/* floating furni around the polaroid */
.hero-media .furni{position:absolute; filter:drop-shadow(3px 3px 0 rgba(38,32,26,.25));animation:float 5s ease-in-out infinite;z-index:3}
.hero-media .furni img{width:100%}
.hero-media .f1{width:74px;top:-26px;left:2%;animation-delay:0s}
.hero-media .f2{width:60px;bottom:-20px;right:4%;animation-delay:.9s}
.hero-media .f3{width:50px;top:26%;right:-16px;animation-delay:1.6s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@media(max-width:520px){.hero-media .f3{display:none}}

/* ============================================================
   6. SECTION HEADINGS
   ============================================================ */
.head{max-width:640px;margin-bottom:var(--s6)}
.head.center{text-align:center;margin-inline:auto}
.head .kick{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:var(--s3)}
.head h2{font-size:clamp(1.9rem,4.2vw,2.9rem);font-weight:800}
.head p{color:var(--muted);margin-top:var(--s3);font-size:1.04rem}

/* ============================================================
   7. GALLERY + LIGHTBOX
   ============================================================ */
/* MASONRY GALLERY
   Fixed columns; each tile keeps its image's true aspect ratio and stacks
   into whichever column is shortest. Nothing is cropped, no holes appear,
   and the only "unevenness" is a natural staggered bottom edge.
   Column count adapts to screen width. */
.gallery{position:relative}
.gallery-more{display:flex;justify-content:center;margin-top:var(--s7)}
.gallery .col{display:flex;flex-direction:column;gap:var(--s4)}
/* the actual column count is set by JS via --cols (never exceeds room count) */
.gallery{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:var(--s4);align-items:start;margin-inline:auto}
/* with only one or two columns, keep the tiles from stretching too wide */
@media(max-width:560px){.gallery{gap:var(--s3)}}
.g{border:2px solid var(--edge);overflow:hidden;position:relative;background:var(--paper);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;cursor:pointer;text-align:left;padding:0;font-family:inherit;width:100%;display:block}
/* the tile's height comes from the image's own ratio (set inline per room) */
.g .ratio{position:relative;width:100%;display:block;height:0}
.g .ratio>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.g .ratio>.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:var(--s4);background:var(--bg-alt)}
.g:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-lg)}
.g .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center;padding:var(--s4);background:var(--bg-alt)}
.g img{width:100%;height:100%;object-fit:cover}
.g .cap{position:absolute;left:10px;bottom:10px;font-size:.72rem;font-weight:700;letter-spacing:.03em;background:var(--yellow);color:#26201a;border:2px solid var(--edge);padding:var(--s1) var(--s2);box-shadow:2px 2px 0 var(--shadowc)}
.g .zoom{position:absolute;top:10px;right:10px;width:32px;height:32px;background:var(--orange);color:#1a1208;border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shadowc);display:flex;align-items:center;justify-content:center;font-size:.95rem;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s}
.g:hover .zoom{opacity:1;transform:none}
.g .zoom svg{display:block}
/* touch devices have no hover, so keep the affordance visible there */
@media(hover:none){.g .zoom{opacity:1;transform:none}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.86);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:var(--s5)}
.lb.open{display:flex}
.lb-inner{position:relative;background:var(--paper);border:2px solid var(--edge);box-shadow:var(--shadow-lg);max-width:1080px;width:100%;max-height:88vh;display:grid;grid-template-columns:1.35fr .65fr;overflow:hidden}
@media(max-width:820px){.lb-inner{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}}
.lb-img{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:300px;border-right:2px solid var(--edge);position:relative}
@media(max-width:820px){.lb-img{border-right:0;border-bottom:2px solid var(--edge);min-height:240px}}
.lb-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .2s ease;transform-origin:center center}
.lb-img.zoomed{cursor:zoom-out}
.lb-img:not(.zoomed) img{cursor:zoom-in}
.lb-img.zoomed img{transition:transform .05s linear;cursor:zoom-out}
.lb-zoom-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.7);color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:4px 10px;border-radius:2px;pointer-events:none;opacity:0;transition:opacity .2s}
.lb-img:hover .lb-zoom-hint{opacity:1}
.lb-img.zoomed .lb-zoom-hint{opacity:0}
.lb-img .noimg{color:var(--muted);font-size:.9rem;padding:var(--s6);text-align:center}
.lb-side{padding:var(--s6);overflow-y:auto;display:flex;flex-direction:column}
.lb-side .kick{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:var(--s3)}
.lb-side h3{font-size:1.6rem;font-weight:800;line-height:1.1;margin-bottom:var(--s4)}
.lb-side .desc{color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:var(--s6)}
.lb-meta{list-style:none;margin-top:auto}
.lb-meta li{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);padding:var(--s3) 0;border-bottom:2px dotted var(--edge);font-size:.88rem}
.lb-meta li:first-child{border-top:2px dotted var(--edge)}
.lb-meta li b{font-weight:700;flex-shrink:0}
.lb-meta li span{color:var(--muted);text-align:right}
.lb-side .btn{margin-top:var(--s6);justify-content:center}
.lb-close{position:absolute;top:var(--s4);right:var(--s4);width:44px;height:44px;background:var(--orange);color:#1a1208;border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadowc);cursor:pointer;font-size:1.15rem;font-weight:700;z-index:6;display:flex;align-items:center;justify-content:center;transition:transform .1s,box-shadow .1s}
.lb-close:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadowc)}
.lb-close:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadowc)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:52px;background:var(--paper);border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadowc);cursor:pointer;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:4}
.lb-prev{left:12px}.lb-next{right:12px}

/* ============================================================
   8. PRICING (with size images)
   ============================================================ */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
@media(max-width:900px){.tiers{grid-template-columns:1fr;max-width:440px;margin-inline:auto}}
.tier{background:var(--paper);border:2px solid var(--edge);box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:transform .12s,box-shadow .12s}
.tier:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-lg)}
/* featured tier stands out through elevation + an orange top accent, not a different colour scheme */
.tier.feat{background:var(--paper-2);border-color:var(--orange);box-shadow:var(--shadow-lg)}
.tier.feat::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--orange)}
/* the visual size guide image at the top of each tier */
.size-img{aspect-ratio:16/9;border-bottom:2px solid var(--edge);background:var(--bg-alt);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-align:center;padding:var(--s3);overflow:hidden;position:relative}
.size-img img{width:100%;height:100%;object-fit:cover}
.size-img .sz{position:absolute;left:8px;bottom:8px;background:var(--ink);color:var(--bg);font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:var(--s1) var(--s2)}
.tier-body{padding:var(--s5);display:flex;flex-direction:column;flex:1}
.tier .ribbon{position:absolute;top:-14px;right:14px;font-size:.68rem;font-weight:700;letter-spacing:.04em;background:var(--orange);color:#1a1208;border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shadowc);padding:var(--s1) var(--s3);transform:rotate(3deg);z-index:3}
.tier .tname{font-size:1.1rem;font-weight:800;letter-spacing:.02em}
.tier .price{font-size:2.5rem;font-weight:800;margin:var(--s3) 0 var(--s1);letter-spacing:-.03em}
.tier .price small{font-size:.9rem;color:var(--muted);font-weight:500}
.tier .muted-x{color:var(--muted);font-size:.92rem;margin-bottom:var(--s4)}
.tier ul{list-style:none;flex:1;margin-bottom:var(--s5)}
.tier li{padding:var(--s2) 0;font-size:.92rem;border-top:2px dotted var(--edge);display:flex;gap:var(--s2)}
.tier li:first-child{border-top:0}
.tier li::before{content:"◆";color:var(--orange);flex-shrink:0}
.tier .btn{width:100%;justify-content:center}
/* all pricing CTAs use the single orange accent; the featured one is solid, the others outlined */
.tier .btn{background:var(--paper);color:var(--ink);border-color:var(--edge)}
.tier .btn:hover{background:var(--orange);color:#1a1208;border-color:var(--edge)}
.tier.feat .btn{background:var(--orange);color:#1a1208}

/* ============================================================
   9. PROCESS
   ============================================================ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--paper);border:2px solid var(--edge);box-shadow:var(--shadow);padding:var(--s5)}
.step .n{font-size:.9rem;font-weight:800;color:var(--orange);background:transparent;border:2px solid var(--orange);box-shadow:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:var(--s4)}
.step h4{font-size:1.05rem;font-weight:700;margin-bottom:var(--s2)}
.step p{color:var(--muted);font-size:.9rem}

/* ============================================================
   10. BOOK / CTA
   ============================================================ */
.book{background:var(--orange);border:2px solid var(--edge);box-shadow:var(--shadow-lg);padding:var(--s7);text-align:center;color:#1a1208;position:relative;overflow:hidden}
.book::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,.07) 20px,rgba(255,255,255,.07) 40px);pointer-events:none}
.book h2{font-size:clamp(1.8rem,4.2vw,2.8rem);font-weight:800;position:relative}
.book p{opacity:.95;margin:var(--s4) auto 0;max-width:46ch;position:relative;font-size:1.05rem}
.book .btns{display:flex;gap:var(--s3);justify-content:center;flex-wrap:wrap;margin-top:var(--s6);position:relative}
.embed-slot{margin-top:var(--s6);border:2px dashed #1a1208;padding:var(--s6);color:#1a1208;font-size:.9rem;max-width:600px;margin-inline:auto;position:relative}

/* ============================================================
   11. FOOTER
   ============================================================ */
footer{padding-block:var(--s7);border-top:2px solid var(--edge);background:var(--paper)}

<script src="rooms.js"></script>
<script>

/* ===== LIBRARY PAGE ===== */
let ALL_ROOMS = [];
let ROOMS = [];                          // current (filtered) set the gallery renders
let activeFilter = 'ALL';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* build filter tabs from the tags actually present */
function buildFilters(){
  const tags = ['ALL', ...Array.from(new Set(ALL_ROOMS.map(r => (r.tag||'').toUpperCase()).filter(Boolean)))];
  const bar = document.getElementById('libFilters');
  bar.innerHTML = tags.map(t =>
    `<button class="lib-filter${t===activeFilter?' active':''}" data-tag="${esc(t)}" onclick="setFilter('${esc(t)}')">${esc(t)}</button>`
  ).join('');
}
function setFilter(tag){
  activeFilter = tag;
  ROOMS = (tag === 'ALL') ? ALL_ROOMS.slice() : ALL_ROOMS.filter(r => (r.tag||'').toUpperCase() === tag);
  document.querySelectorAll('.lib-filter').forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
  document.getElementById('libCount').textContent =
    ROOMS.length + (ROOMS.length === 1 ? ' build' : ' builds');

  // fade out, swap in the new set once measured, fade back in — no jarring jump
  var grid = document.getElementById('galleryGrid');
  var wasEmpty = !grid.children.length;
  measured = null;
  measureRooms().then(function(rs){
    function paint(){ measured = rs; layoutGallery(); grid.classList.remove('fading'); }
    if (wasEmpty) { paint(); }
    else {
      grid.classList.add('fading');
      setTimeout(paint, 200);
    }
  });
}





/* hero */


/* scroll-reveal observer (declared before the gallery uses it) */
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold:.1 });

/* gallery — masonry.
   Each image's real width/height is measured, then tiles are placed into
   whichever column is currently shortest. Images are never cropped and
   no gaps are left. Rooms without an image use a default 4:3 shape. */
const galleryEl = document.getElementById('galleryGrid');

function columnCount(){
  const w = window.innerWidth;
  let c = 3;                       /* up to 3 columns on desktop */
  if(w <= 560) c = 1;              /* phones: single column */
  else if(w <= 980) c = 2;         /* tablets: two columns */
  /* never more columns than there are rooms (avoids empty columns),
     but otherwise always fill the row: 2 rooms -> 2 across, 3 -> 3, etc. */
  return Math.max(1, Math.min(c, ROOMS.length || 1));
}

/* measure every room image up front (cached) */
function measureRooms(){
  return Promise.all(ROOMS.map(r => new Promise(resolve => {
    if(!r.img){ resolve({ ...r, ratio: 3/4 }); return; }        // no image -> 4:3 box
    const im = new Image();
    im.onload  = () => resolve({ ...r, ratio: im.naturalHeight / im.naturalWidth });
    im.onerror = () => resolve({ ...r, ratio: 3/4 });            // broken path -> fallback
    im.src = r.img;
  })));
}

function tileHTML(r, i){
  const pct = (r.ratio * 100).toFixed(3);
  return `
  <button class="g rv" onclick="openLb(${i})" aria-label="${esc(r.name)}">
    <span class="ratio" style="padding-bottom:${pct}%">
      ${r.img
        ? `<img src="${esc(r.img)}" alt="${esc(r.name)}">`
        : `<span class="ph">Add image for<br><b>${esc(r.name)}</b></span>`}
    </span>
    <span class="cap">${esc(r.tag)}</span>
    <span class="zoom"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></span>
  </button>`;
}

let measured = null;
function layoutGallery(){
  if(!measured) return;
  const cols = columnCount();
  const buckets = Array.from({length: cols}, () => []);

  if(cols === 1){
    measured.forEach((r,i) => buckets[0].push(tileHTML(r,i)));
  }else{
    /* Work out which column each tile goes in, aiming for an even bottom edge.
       Small galleries: try every combination and keep the best (cheap, optimal).
       Larger ones: greedy placement, then iteratively rebalance. */
    const w = measured.map(r => r.ratio + 0.12);   // +0.12 ≈ gap + caption
    const n = measured.length;
    let assign;

    if(Math.pow(cols, n) <= 60000){
      let best = null, bestScore = Infinity;
      const cur = new Array(n).fill(0);
      (function search(i){
        if(i === n){
          const hs = new Array(cols).fill(0);
          for(let k = 0; k < n; k++) hs[cur[k]] += w[k];
          if(Math.min(...hs) === 0 && n >= cols) return;   // no empty columns
          const score = Math.max(...hs) - Math.min(...hs);
          if(score < bestScore){ bestScore = score; best = cur.slice(); }
          return;
        }
        for(let c = 0; c < cols; c++){ cur[i] = c; search(i + 1); }
      })(0);
      assign = best || new Array(n).fill(0).map((_, i) => i % cols);
    }else{
      const heights = new Array(cols).fill(0);
      assign = new Array(n).fill(0);
      measured.forEach((r, i) => {
        let t = 0;
        for(let c = 1; c < cols; c++) if(heights[c] < heights[t] - 0.001) t = c;
        assign[i] = t; heights[t] += w[i];
      });
      for(let pass = 0; pass < 60; pass++){
        let tall = 0, short = 0;
        for(let c = 1; c < cols; c++){
          if(heights[c] > heights[tall]) tall = c;
          if(heights[c] < heights[short]) short = c;
        }
        if(tall === short) break;
        let bestIdx = -1, bestGap = heights[tall] - heights[short];
        for(let i = 0; i < n; i++){
          if(assign[i] !== tall) continue;
          const after = Math.abs((heights[tall] - w[i]) - (heights[short] + w[i]));
          if(after < bestGap - 0.001){ bestGap = after; bestIdx = i; }
        }
        if(bestIdx < 0) break;
        assign[bestIdx] = short;
        heights[tall] -= w[bestIdx];
        heights[short] += w[bestIdx];
      }
    }

    measured.forEach((r, i) => buckets[assign[i]].push(tileHTML(r, i)));
  }

  galleryEl.style.setProperty('--cols', cols);
  galleryEl.innerHTML = buckets.map(b => `<div class="col">${b.join('')}</div>`).join('');
  galleryEl.querySelectorAll('.rv').forEach(el => { el.classList.add('in'); io.observe(el); });
}


let galleryResizeTimer, lastCols = columnCount();
addEventListener('resize', () => {
  clearTimeout(galleryResizeTimer);
  galleryResizeTimer = setTimeout(() => {
    if(columnCount() !== lastCols){ lastCols = columnCount(); layoutGallery(); }
  }, 150);
});





/* ---- lightbox ---- */
let lbIndex = 0;
function openLb(i){
  lbIndex = i;
  const r = ROOMS[i];
  const imgBox = document.getElementById('lbImg');
  imgBox.querySelectorAll('img,.noimg').forEach(el => el.remove());
  imgBox.classList.toggle('empty', !r.img);
  imgBox.classList.remove('zoomed');
  const node = r.img
    ? Object.assign(document.createElement('img'), { src: r.img, alt: r.name })
    : Object.assign(document.createElement('div'), { className: 'noimg', textContent: 'No image yet — add one in the ROOMS list' });
  imgBox.appendChild(node);
  if(r.img) setupZoom(imgBox, node);
  document.getElementById('lbKick').textContent  = r.tag;
  document.getElementById('lbTitle').textContent = r.name;
  document.getElementById('lbDesc').textContent  = r.about;
  document.getElementById('lbMeta').innerHTML = Object.entries(r.meta)
    .map(([k,v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('');
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function setupZoom(box, img, scale){
  scale = scale || 2.4;
  img.style.transform = '';
  img.style.transformOrigin = 'center center';
  function toPoint(e){
    const rect = box.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    return { x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)) };
  }
  img.onclick = function(e){
    e.stopPropagation();
    if(box.classList.contains('zoomed')){
      box.classList.remove('zoomed');
      img.style.transform = '';
    } else {
      const p = toPoint(e);
      box.classList.add('zoomed');
      img.style.transformOrigin = p.x + '% ' + p.y + '%';
      img.style.transform = 'scale(' + scale + ')';
    }
  };
  img.onmousemove = function(e){
    if(!box.classList.contains('zoomed')) return;
    const p = toPoint(e);
    img.style.transformOrigin = p.x + '% ' + p.y + '%';
  };
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  const imgBox = document.getElementById('lbImg');
  imgBox.classList.remove('zoomed');
  const img = imgBox.querySelector('img');
  if(img) img.style.transform = '';
}
function stepLb(d){
  event.stopPropagation();
  openLb((lbIndex + d + ROOMS.length) % ROOMS.length);
}
document.addEventListener('keydown', e => {
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowLeft')  openLb((lbIndex - 1 + ROOMS.length) % ROOMS.length);
  if(e.key === 'ArrowRight') openLb((lbIndex + 1) % ROOMS.length);
});

/* ---- theme ---- */
(function(){
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e){}
  if(!saved){
    try { saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e){ saved = 'light'; }
  }
  if(saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
})();
function toggleTheme(){
  const el = document.documentElement;
  const dark = el.getAttribute('data-theme') === 'dark';
  dark ? el.removeAttribute('data-theme') : el.setAttribute('data-theme','dark');
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch(e){}
}

/* ---- misc ---- */
document.getElementById('yr').textContent = new Date().getFullYear();
document.querySelectorAll('#nl a').forEach(a => a.addEventListener('click', () => document.getElementById('nl').classList.remove('open')));
document.querySelectorAll('.rv').forEach(el => io.observe(el));


/* init library */
/* init library once the shared content has loaded */
(window.ROOMS_READY || Promise.resolve([])).then(function(all){
  ALL_ROOMS = all || [];
  buildFilters();
  setFilter('ALL');
});
</script>
